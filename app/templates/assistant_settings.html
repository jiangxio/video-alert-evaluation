{% extends "base.html" %}

{% block title %}AI 助手设置 - 视觉算法评测平台{% endblock %}

{% block content %}
<div class="card">
    <h3>AI 助手设置</h3>
    <div style="background:#e8f5e9;border:1px solid #81c784;border-radius:4px;padding:0.6rem 0.8rem;font-size:0.82rem;color:#2e7d32;margin-bottom:1rem;">
      💡 AI 助手使用的模型 API Key、Base URL、模型名请在 <a href="/api-config/">统一 API 配置</a> 的「文本逻辑组」中管理。本页仅配置助手专属的调用限制。
    </div>
    <form id="assistant-settings-form">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">每会话最大消息数</label>
            <input type="number" id="max_messages_per_session" name="max_messages_per_session"
                   value="{{ settings.max_messages_per_session }}"
                   style="width: 200px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">每会话最大写入操作数</label>
            <input type="number" id="max_write_actions_per_session" name="max_write_actions_per_session"
                   value="{{ settings.max_write_actions_per_session }}"
                   style="width: 200px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">确认令牌过期时间（秒）</label>
            <input type="number" id="confirmation_ttl_seconds" name="confirmation_ttl_seconds"
                   value="{{ settings.confirmation_ttl_seconds }}"
                   style="width: 200px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button type="submit" class="btn">保存设置</button>
    </form>

    <div id="settings-message" class="message hidden" style="margin-top: 1rem;"></div>
</div>

<script>
document.getElementById('assistant-settings-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {};
    ['max_messages_per_session', 'max_write_actions_per_session', 'confirmation_ttl_seconds']
        .forEach(id => {
            const el = document.getElementById(id);
            data[id] = el.value;
        });

    const resp = await fetch('/assistant/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    const result = await resp.json();
    const msgEl = document.getElementById('settings-message');
    msgEl.classList.remove('hidden', 'message-success', 'message-error');
    if (result.success) {
        msgEl.classList.add('message-success');
        msgEl.textContent = '设置已保存';
    } else {
        msgEl.classList.add('message-error');
        msgEl.textContent = '保存失败：' + (result.error || '未知错误');
    }
});
</script>
{% endblock %}
