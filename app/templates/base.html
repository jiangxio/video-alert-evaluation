<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}视频数据预处理与告警评估平台{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; }
        header h1 { margin: 0; font-size: 1.5rem; }
        nav { margin-top: 1rem; }
        nav a { color: white; text-decoration: none; margin-right: 1.5rem; padding: 0.5rem 0; border-bottom: 2px solid transparent; }
        nav a:hover, nav a.active { border-bottom-color: #3498db; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .btn { display: inline-block; padding: 0.6rem 1.2rem; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; text-decoration: none; }
        .btn:hover { background: #2980b9; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #219a52; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d68910; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h3 { margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        .status-correct { color: #27ae60; font-weight: bold; }
        .status-incorrect { color: #e74c3c; font-weight: bold; }
        .status-unknown { color: #f39c12; font-weight: bold; }
        .upload-area { border: 2px dashed #bdc3c7; border-radius: 8px; padding: 2rem; text-align: center; margin-bottom: 1rem; }
        .upload-area.dragover { border-color: #3498db; background: #ecf0f1; }
        .hidden { display: none; }
        .message { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .message-success { background: #d4edda; color: #155724; }
        .message-error { background: #f8d7da; color: #721c24; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="/static/css/assistant.css">
</head>
<body>
    <header>
        <h1>视频数据预处理与告警评估平台</h1>
        <nav>
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">首页</a>
            <a href="/videos/upload/" class="{% if request.path == '/videos/upload/' %}active{% endif %}">视频上传</a>
            <a href="/videos/" class="{% if request.path == '/videos/' %}active{% endif %}">视频管理</a>
            <a href="/alerts/" class="{% if request.path.startswith('/alerts') %}active{% endif %}">告警数据集</a>
            <a href="/evaluation/" class="{% if request.path.startswith('/evaluation') %}active{% endif %}">评测</a>
            <a href="/auto-annotation/" class="{% if request.path.startswith('/auto-annotation') %}active{% endif %}">自动标注</a>
            <a href="/streaming/" class="{% if request.path.startswith('/streaming') %}active{% endif %}">推流</a>
            <a href="/algorithms/" class="{% if request.path.startswith('/algorithms') %}active{% endif %}">算法管理</a>
            <a href="/algorithms/types" class="{% if request.path == '/algorithms/types' %}active{% endif %}">算法类型</a>
            <a href="/assistant/settings" class="{% if request.path.startswith('/assistant') %}active{% endif %}">AI 助手设置</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% include 'assistant_widget.html' %}
    <script src="/static/js/app.js"></script>
    <script src="/static/js/assistant.js"></script>
</body>
</html>
