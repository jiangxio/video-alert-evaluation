<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>{{ project_name }} - 分类结果评估</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <a href="/version/{{ version_id }}" class="header-back">← 返回标注</a>
        <h1>{{ project_name }} — 分类结果评估</h1>
    </header>
    <div class="container">
        <!-- Left: control panel -->
        <aside id="eval-side-panel">
            <h2>评估配置</h2>

            <div class="eval-ctrl-group">
                <div class="eval-hint" style="background:#e8f4f4; border:1px solid #2b7a78; border-radius:4px; padding:6px 8px; color:#2b7a78;">
                    GT 数据：使用项目标注的整图类别
                </div>
            </div>

            <div class="eval-ctrl-group">
                <label>预测结果 CSV <span style="font-weight:400;color:#999;">（image_name, class, conf）</span></label>
                <div class="export-row">
                    <input type="text" id="eval-pred-dir" class="export-path" readonly placeholder="选择预测 CSV 文件…" />
                    <button class="btn-sm" id="btn-browse-pred">浏览</button>
                </div>
                <div class="eval-hint">格式：image_name, predicted_class, confidence</div>
            </div>

            <div class="eval-ctrl-group">
                <label>置信度阈值</label>
                <div class="threshold-row">
                    <input type="number" id="conf-val" min="0" max="1" step="0.05" value="0" />
                    <input type="range" id="conf-slider" min="0" max="1" step="0.05" value="0" />
                </div>
            </div>

            <button id="btn-run-eval" class="btn-primary" style="width:100%;margin-top:8px;">开始评估</button>
            <div id="eval-status" style="margin-top:8px;font-size:13px;color:#666;"></div>

            <!-- Save result -->
            <div style="border-top:1px solid #eee;margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;font-weight:600;color:#555;">保存评估结果</label>
                <input type="text" id="eval-result-name" placeholder="输入评估名称…"
                       style="padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;" />
                <button id="btn-save-eval-result" class="btn-sm" style="width:100%;">保存评估结果</button>
            </div>

            <!-- Load saved result -->
            <div style="border-top:1px solid #eee;margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;font-weight:600;color:#555;">历史评估结果</label>
                <select id="eval-result-select" style="padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;">
                    <option value="">-- 选择历史结果 --</option>
                </select>
                <div style="display:flex;gap:6px;">
                    <button id="btn-load-eval-result" class="btn-sm" style="flex:1;">加载</button>
                    <button id="btn-delete-eval-result" class="btn-danger" style="padding:3px 10px;font-size:12px;">删除</button>
                </div>
            </div>
        </aside>

        <!-- Right: results -->
        <main style="flex:1; min-width:0; display:flex; flex-direction:column; gap:12px;">

            <!-- Accuracy + per-class + confusion -->
            <div id="eval-metrics-wrap" style="display:none; background:white; border:1px solid #ddd; border-radius:8px; padding:12px;">
                <h3 style="margin:0 0 10px; font-size:15px; color:#2b7a78;">评估指标</h3>
                <div id="eval-accuracy" class="accuracy-big"></div>
                <table class="eval-metrics-table" style="margin-top:10px;">
                    <thead>
                        <tr>
                            <th>类别</th>
                            <th>精确率</th>
                            <th>召回率</th>
                            <th>F1</th>
                            <th>TP</th>
                            <th>FP（误判）</th>
                            <th>FN（漏判）</th>
                        </tr>
                    </thead>
                    <tbody id="eval-metrics-body"></tbody>
                </table>
                <h4 style="margin:14px 0 6px; font-size:14px; color:#2b7a78;">混淆矩阵（行=真值，列=预测）</h4>
                <div id="eval-confusion-wrap" class="confusion-wrap"></div>
            </div>

            <!-- Filter tabs + image grid -->
            <div id="eval-grid-wrap" style="display:none; background:white; border:1px solid #ddd; border-radius:8px; padding:12px;">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">全部 <span id="cnt-all">0</span></button>
                        <button class="filter-tab" data-filter="correct">正确 <span id="cnt-correct">0</span></button>
                        <button class="filter-tab" data-filter="wrong">错误 <span id="cnt-wrong">0</span></button>
                    </div>
                </div>
                <div id="eval-image-grid" class="eval-image-grid"></div>
                <div id="eval-pagination" style="display:none; margin-top:10px; display:flex; align-items:center; gap:8px;">
                    <button id="btn-eval-prev-page" class="btn-sm">上一页</button>
                    <span id="eval-page-info" style="font-size:13px; color:#555;"></span>
                    <button id="btn-eval-next-page" class="btn-sm">下一页</button>
                </div>
            </div>

            <!-- Viewer -->
            <div id="eval-viewer" style="display:none; background:white; border:1px solid #ddd; border-radius:8px; padding:12px;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                    <button id="btn-eval-back-grid" class="btn-sm">← 返回网格</button>
                    <button id="btn-eval-prev" class="btn-sm">上一张</button>
                    <button id="btn-eval-next" class="btn-sm">下一张</button>
                    <span id="eval-viewer-title" style="font-size:13px;color:#555;"></span>
                </div>
                <div id="eval-image-holder" style="position:relative; display:inline-block; max-width:100%;">
                    <img id="eval-current-image" src="" alt="" style="max-width:100%; max-height:70vh; display:block; object-fit:contain;" crossorigin="anonymous" />
                </div>
                <div id="eval-box-legend" style="margin-top:8px; font-size:13px; color:#666;"></div>
            </div>

        </main>
    </div>

    <!-- Dir Browser Modal (shows files for CSV selection) -->
    <div id="dir-browser-modal" class="modal-overlay" style="display:none;">
        <div id="dir-browser-box">
            <div id="dir-browser-header">
                <strong>选择预测 CSV</strong>
                <button id="dir-browser-close">×</button>
            </div>
            <div id="dir-browser-path"></div>
            <ul id="dir-browser-list"></ul>
            <div id="dir-browser-footer">
                <button id="dir-browser-select">选择</button>
                <button id="dir-browser-cancel">取消</button>
            </div>
        </div>
    </div>

    <script>
      const CLASSES = {{ classes | tojson | safe }};
      const BASE_DIR = {{ base_dir | tojson | safe }};
      const PROJECT_ID = {{ project_id | tojson | safe }};
      const VERSION_ID = {{ version_id | tojson | safe }};
    </script>
    <script src="/static/evaluate_classify.js"></script>
</body>
</html>
