<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>{{ project_name }} - 图像标注与评测平台</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <a href="/project/{{ project_id }}" class="header-back">← 返回项目</a>
        <h1>{{ project_name }}</h1>
        <div class="header-actions">
            <a href="/version/{{ version_id }}/evaluate" class="header-eval-btn">检测结果评估</a>
            <a href="/version/{{ version_id }}/overview" class="header-eval-btn">概况分析</a>
            <a href="/version/{{ version_id }}/qc" class="header-eval-btn">数据质检</a>
        </div>
    </header>
    <div class="container">
        <main>
            <div class="toolbar">
                <div class="toolbar-stats" id="stats"></div>
                <div class="toolbar-filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="labeled">已标注</button>
                    <button class="filter-btn" data-filter="unlabeled">未标注</button>
                </div>
                <div class="toolbar-class-filter">
                    <label for="class-filter-select" class="class-filter-label">类别：</label>
                    <select id="class-filter-select">
                        <option value="all">全部类别</option>
                    </select>
                </div>
                <div class="toolbar-actions">
                    <input type="file" id="upload-images" multiple accept="image/*" style="display:none" />
                    <button id="btn-upload">上传图片</button>
                    <button id="btn-refresh">刷新</button>
                    <button id="btn-annotate">标注</button>
                    <button id="btn-delete-selected">删除选中</button>
                </div>
            </div>
            <div id="grid-view">
                <div id="grid-controls">
                    <button id="btn-prev-page">上一页</button>
                    <span id="page-info">第 1 页 / 共 1 页</span>
                    <button id="btn-next-page">下一页</button>
                </div>
                <div id="image-grid"></div>
            </div>
            <section id="viewer" style="display:none;">
                <div id="image-holder">
                    <img id="current-image" src="" alt="请选择图片" crossorigin="anonymous" />
                    <svg id="overlay"></svg>
                </div>
                <div id="controls">
                    <button id="btn-back-to-grid">返回网格</button>
                    <button id="btn-prev-image">上一张</button>
                    <button id="btn-next-image">下一张</button>
                    <span id="filter-indicator"></span>
                    <label for="class-select">类别：</label>
                    <select id="class-select"></select>
                    <button id="btn-start-draw">新增框</button>
                    <button id="btn-delete-box">删除选中框</button>
                    <button id="btn-clear-all">清除所有框</button>
                    <button id="btn-save">保存标注</button>
                    <span id="current-status"></span>
                    <div class="resize-controls">
                        <span class="resize-label">高度调整：</span>
                        <button class="resize-btn" data-ratio="0.8">×0.8</button>
                        <button class="resize-btn" data-ratio="1.2">×1.2</button>
                        <input type="number" id="resize-ratio" step="0.1" min="0.1" max="3.0" value="1.0" />
                        <button id="btn-resize-preview">预览</button>
                        <button id="btn-resize-apply">应用</button>
                        <button id="btn-resize-reset" style="display:none;">重置</button>
                    </div>
                    <div class="scale-controls">
                        <span class="scale-label">缩放(黑边)：</span>
                        <button class="scale-btn" data-ratio="0.8">×0.8</button>
                        <button class="scale-btn" data-ratio="1.2">×1.2</button>
                        <input type="number" id="scale-ratio" step="0.1" min="0.1" max="3.0" value="1.0" />
                        <button id="btn-scale-preview">预览</button>
                        <button id="btn-scale-apply">应用</button>
                        <button id="btn-scale-reset" style="display:none;">重置</button>
                    </div>
                </div>
            </section>
            <!-- Color legend -->
            <section id="class-legend-section">
                <div id="class-color-legend"></div>
            </section>

            <section id="io-section">
                <div class="io-section-title">YOLO 标注导入 / 导出</div>
                <div class="export-row">
                    <span class="io-label">导入：</span>
                    <input type="text" id="yolo-import-dir" class="export-path" readonly placeholder="选择 YOLO 标注目录…" />
                    <button class="btn-browse" id="btn-browse-yolo-import">浏览</button>
                    <button id="btn-import-yolo-dir">导入</button>
                </div>
                <div class="export-row">
                    <span class="io-label">导出：</span>
                    <input type="text" id="yolo-export-dir" class="export-path" readonly placeholder="选择输出目录…" />
                    <button class="btn-browse" id="btn-browse-yolo-export">浏览</button>
                    <button id="btn-export-yolo">导出</button>
                </div>
                <div id="message"></div>
            </section>
        </main>
    </div>

    <!-- Dir Browser Modal (used by export path selection) -->
    <div id="dir-browser-modal" class="modal-overlay" style="display:none;">
        <div id="dir-browser-box">
            <div id="dir-browser-header">
                <strong>选择目录</strong>
                <button id="dir-browser-close">×</button>
            </div>
            <div id="dir-browser-path"></div>
            <ul id="dir-browser-list"></ul>
            <div id="dir-browser-footer">
                <button id="dir-browser-select">选择此目录</button>
                <button id="dir-browser-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="width:560px;">
            <div class="modal-header">
                <strong>上传图片</strong>
                <button class="modal-close" id="upload-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>选择图片文件</label>
                    <input type="file" id="upload-file-input" multiple accept="image/*" />
                </div>
                <div id="upload-file-preview" style="font-size:12px; color:#666; max-height:120px; overflow-y:auto;"></div>
                <div id="upload-result" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="upload-confirm">确认上传</button>
                <button class="btn-edit" id="upload-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal (large image preview) -->
    <div id="lightbox-modal" class="modal-overlay" style="display:none;">
        <div id="lightbox-box">
            <div id="lightbox-header">
                <span id="lightbox-title"></span>
                <button class="modal-close" id="lightbox-close">×</button>
            </div>
            <div id="lightbox-body">
                <img id="lightbox-image" src="" alt="" />
            </div>
            <div id="lightbox-footer">
                <button id="lightbox-prev">上一张</button>
                <span id="lightbox-counter"></span>
                <button id="lightbox-next">下一张</button>
                <button id="lightbox-annotate">进入标注</button>
            </div>
        </div>
    </div>

    <script>
      const CLASSES = {{ classes | tojson | safe }};
      const BASE_DIR = {{ base_dir | tojson | safe }};
      const PROJECT_ID = {{ project_id | tojson | safe }};
      const VERSION_ID = {{ version_id | tojson | safe }};
    </script>
    <script src="/static/upload_modal.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
